[project]
name = "reveal-market-api"
version = "0.5.0"
description = "FastAPI service exposing market data for Reveal Market."
readme = "README.md"
authors = [{ name = "Reveal Market", email = "dev@revealmarket.xyz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.129,<0.130",
    "uvicorn[standard]~=0.38.0",
    "sqlalchemy~=2.0.44",
    "asyncpg~=0.31.0",
    "psycopg2-binary~=2.9.11",
    "pydantic~=2.12.4",
    "pydantic-settings~=2.12.0",
    "redis~=5.3.1",
    "httpx>=0.27,<0.28",
    "python-dotenv~=1.2.1",
    "alembic~=1.17.2",
    "aiosqlite~=0.22.1",
    "prometheus-fastapi-instrumentator~=6.1.0",
    "prometheus-client~=0.23.1",
    "python-json-logger~=2.0.7",
    "tenacity~=9.1.2",
    "web3~=7.14.0",
    "py-clob-client>=0.28.0,<0.29",
    "greenlet~=3.2.4",
    "hatchling~=1.28.0",
    "pre-commit~=4.5.0",
]

[project.optional-dependencies]
dev = [
    # Local development + CI tooling
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23.8,<0.24",
    "pytest-xdist>=3.8,<4.0",
    "execnet>=2.1.2,<3.0",
    "librt>=0.6.3,<0.7",
    "mypy>=1.19,<2.0",
    "mypy-extensions>=1.0.0,<2.0",
    "ruff==0.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "shared.*",
    "py_clob_client.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
