[tool.poetry]
name = "reveal-market-api"
version = "0.1.0"
description = "FastAPI service exposing market data for Reveal Market."
authors = ["Reveal Market <dev@revealmarket.xyz>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.111.0"
uvicorn = {version = "^0.29.0", extras = ["standard"]}
sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
pydantic = "^2.7.1"
redis = "^5.0.4"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
