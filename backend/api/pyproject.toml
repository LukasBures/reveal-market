[project]
name = "reveal-market-api"
version = "0.1.0"
description = "FastAPI service exposing market data for Reveal Market."
readme = "README.md"
authors = [{ name = "Reveal Market", email = "dev@revealmarket.xyz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "pydantic>=2.7.1,<3.0",
    "pydantic-settings>=2.2.1,<3.0",
    "redis>=5.0.4,<6.0",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1.0.1,<2.0",
    "alembic>=1.13.2,<2.0",
    "aiosqlite>=0.20,<1.0",
    "prometheus-fastapi-instrumentator>=6.1,<7.0",
    "prometheus-client>=0.23.1,<1.0",
    "python-json-logger>=2.0.7,<3.0",
    "tenacity>=9.0.0,<10.0",
    "web3>=7.0,<8.0",
    "py-clob-client>=0.28.0,<0.29",
    "greenlet>=3.0,<4.0",
    "hatchling>=1.8.0",
    "pre-commit>=4.5.0",
]

[project.optional-dependencies]
dev = [
    # Local development + CI tooling
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23.8,<0.24",
    "pytest-xdist>=3.8,<4.0",
    "execnet>=2.1.2,<3.0",
    "librt>=0.6.3,<0.7",
    "mypy>=1.19,<2.0",
    "mypy-extensions>=1.0.0,<2.0",
    "ruff>=0.14.5,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "shared.*",
    "py_clob_client.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
