[tool.poetry]
name = "reveal-market-api"
version = "0.1.0"
description = "FastAPI service exposing market data for Reveal Market."
authors = ["Reveal Market <dev@revealmarket.xyz>"]
packages = [
    { include = "app" },
    { include = "shared", from = ".." },
]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.111.0"
uvicorn = {version = "^0.29.0", extras = ["standard"]}
sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
redis = "^5.0.4"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
alembic = "^1.13.2"
prometheus-fastapi-instrumentator = "^6.1.0"
prometheus-client = "^0.23.1"
python-json-logger = "^2.0.7"
tenacity = "^9.0.0"
web3 = "^6.18.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
flake8 = "^7.0.0"
isort = "^5.13.2"
pytest = "^8.2.1"
pytest-asyncio = "^0.23.6"

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = true

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
