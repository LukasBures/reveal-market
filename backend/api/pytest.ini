[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths =
    tests

pythonpath =
    .
    ..

addopts =
    -ra
    --color=yes
    --maxfail=1
    --disable-warnings

filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::pydantic.warnings.PydanticDeprecatedSince212

markers =
    live: requires live network/API access
