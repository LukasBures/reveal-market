[project]
name = "reveal-market-worker"
version = "0.5.0"
description = "Background worker synchronising markets from Polymarket."
readme = "README.md"
authors = [{ name = "Reveal Market", email = "dev@revealmarket.xyz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy~=2.0.44",
    "psycopg2-binary~=2.9.11",
    "asyncpg~=0.31.0",
    "greenlet~=3.2.4",
    "httpx>=0.27,<0.28",
    "pydantic~=2.12.4",
    "pydantic-settings~=2.12.0",
    "redis~=5.3.1",
    "python-dotenv~=1.2.1",
    "python-json-logger~=2.0.7",
    "tenacity~=9.1.2",
    "web3~=7.14.0",
    "alembic~=1.17.2",
    "prometheus-client~=0.23.1",
    "py-clob-client>=0.28.0,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-xdist>=3.6,<4.0",
    "mypy>=1.10,<2.0",
    "ruff==0.15.1",
    "aiosqlite>=0.20,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "sqlalchemy (>=2.0.44,<3.0.0)"
]
