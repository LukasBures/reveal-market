[tool.poetry]
name = "reveal-market-worker"
version = "0.1.0"
description = "Background worker synchronising markets from Polymarket."
authors = ["Reveal Market <dev@revealmarket.xyz>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
httpx = "^0.27.0"
pydantic = "^2.7.1"
redis = "^5.0.4"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
