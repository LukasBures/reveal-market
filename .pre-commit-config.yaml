default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check
        description: "Run 'ruff check' for extremely fast Python linting"
        entry: ruff check --fix --force-exclude --config pyproject.toml
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true
        additional_dependencies: ["ruff>=0.6.9"]
      - id: ruff-format
        name: ruff format
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: ruff format --force-exclude --config pyproject.toml
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true
        additional_dependencies: ["ruff>=0.6.9"]
      - id: mypy-api
        name: mypy (api)
        description: "Static type checks for backend API"
        entry: bash -c 'set -euo pipefail; MYPY_CACHE_DIR=/tmp/.mypy_cache uv run --project backend/api -- mypy --config-file pyproject.toml backend/api/app backend/shared'
        language: system
        types_or: [python]
        pass_filenames: false
        require_serial: true
      - id: mypy-worker
        name: mypy (worker)
        description: "Static type checks for worker"
        entry: bash -c 'set -euo pipefail; MYPY_CACHE_DIR=/tmp/.mypy_cache uv run --project backend/worker -- mypy --config-file pyproject.toml backend/worker/app backend/shared'
        language: system
        types_or: [python]
        pass_filenames: false
        require_serial: true
      - id: mypy-streamer
        name: mypy (streamer)
        description: "Static type checks for streamer"
        entry: bash -c 'set -euo pipefail; MYPY_CACHE_DIR=/tmp/.mypy_cache uv run --project streamer -- mypy --config-file pyproject.toml streamer/app'
        language: system
        types_or: [python]
        pass_filenames: false
        require_serial: true
      - id: mypy-relayer
        name: mypy (relayer)
        description: "Static type checks for relayer"
        entry: bash -c 'set -euo pipefail; MYPY_CACHE_DIR=/tmp/.mypy_cache uv run --project relayer -- mypy --config-file pyproject.toml relayer/src/relayer'
        language: system
        types_or: [python]
        pass_filenames: false
        require_serial: true
      - id: refresh-settlement-vk-json
        name: refresh settlement vk json constant
        description: "Regenerate contracts/zen/test/generated/SettlementVkJson.sol from the cached VK JSON"
        entry: bash -c 'cd contracts/zen && python3 scripts/generate_settlement_vk_json.py'
        language: system
        pass_filenames: false
        always_run: true
      - id: forge-snapshot
        name: forge snapshot (contracts/* workspaces)
        description: "Regenerate gas snapshots when contracts change"
        entry: |
          bash -c '
            set -e
            ROOT="$(git rev-parse --show-toplevel)"
            for DIR in "$ROOT"/contracts/*; do
              [ -d "$DIR" ] || continue
              [ -f "$DIR/foundry.toml" ] || continue
              cd "$DIR"
              forge snapshot --check
            done
          '
        language: system
        pass_filenames: false
        files: ^contracts/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: trailing-whitespace
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: mixed-line-ending
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: check-yaml
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: name-tests-test
        name: Enforce pytest naming
        args: ["--pytest-test-first"]
        exclude: ^(\.venv|build|dist|logs|runtime)/
