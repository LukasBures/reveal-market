default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: poetry-run-black
        name: Format code with Black
        entry: bash -lc 'cd backend/api && poetry run black .'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/api/.*\.py$

      - id: poetry-run-isort
        name: Sort imports with isort
        entry: bash -lc 'cd backend/api && poetry run isort .'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/api/.*\.py$

      - id: poetry-run-flake8
        name: Lint code with Flake8
        entry: bash -lc 'cd backend/api && poetry run flake8 .. --exclude .venv'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: trailing-whitespace
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: mixed-line-ending
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: check-yaml
        exclude: ^(\.venv|build|dist|logs|runtime)/
      - id: name-tests-test
        name: Enforce pytest naming
        args: ["--pytest-test-first"]
        exclude: ^(\.venv|build|dist|logs|runtime)/
