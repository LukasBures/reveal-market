[project]
name = "reveal-market-streamer"
version = "0.5.0"
description = "Polymarket market/FX streamer with SSE/WS fanout and FX integration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.129,<0.130",
    "uvicorn>=0.30,<0.31",
    "pydantic~=2.12.4",
    "pydantic-settings~=2.12.0",
    "redis~=5.3.1",
    "httpx>=0.27,<0.29",
    "websockets>=12.0,<13.0",
    "python-json-logger~=2.0.7",
    "prometheus-client~=0.23.1",
    "py-clob-client>=0.28.0,<0.29",
    "websocket-client>=1.8,<1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-xdist>=3.6,<4.0",
    "mypy>=1.10,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
