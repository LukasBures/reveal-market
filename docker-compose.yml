name: reveal-market

# Optional environment anchor shared by API + worker so we do not duplicate
# connection strings. Override values via .env / CLI if needed.

x-backend-env: &backend-env
  TZ: UTC
  RM_ENVIRONMENT: ${RM_ENVIRONMENT:-local}

services:
  postgres:
    image: postgres:15-alpine
    container_name: reveal-market-postgres
    user: "70:70"
    restart: unless-stopped
    shm_size: "1gb"
    command:
      - "postgres"
      # ---- Memory ----
      # ~25% of container memory (4G)
      - "-c"
      - "shared_buffers=1GB"
      # Per-sort / per-hash; 32MB gives room for complex sorts within 4GB container
      - "-c"
      - "work_mem=32MB"
      # Used for vacuum, index builds, retention cleanup
      - "-c"
      - "maintenance_work_mem=512MB"
      # ---- WAL & Checkpoints ----
      - "-c"
      - "max_wal_size=6GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "wal_buffers=32MB"
      # ---- Parallelism / CPU ----
      # Match Docker CPU limits
      - "-c"
      - "max_connections=100"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_worker_processes=4"
      # ---- Planner / IO ----
      # Assume SSD / cloud disk
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_cache_size=3GB"
      # Disable JIT for OLTP workloads (saves 5-20ms per query).
      - "-c"
      - "jit=off"
      # Alpine doesn't support huge pages; avoid startup warning.
      - "-c"
      - "huge_pages=off"
      # ---- Autovacuum (important for retention deletes) ----
      - "-c"
      - "autovacuum_max_workers=3"
      - "-c"
      - "autovacuum_naptime=30s"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.02"
      # ---- Extensions ----
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      # ---- Safety / Observability ----
      - "-c"
      - "log_min_duration_statement=3s"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_autovacuum_min_duration=1s"
      # ---- Safety ----
      # Kill runaway queries after 60s.
      - "-c"
      - "statement_timeout=60s"
      # Kill idle-in-transaction sessions after 120s.
      - "-c"
      - "idle_in_transaction_session_timeout=120s"
    environment:
      POSTGRES_USER: market_admin
      POSTGRES_PASSWORD: <REDACTED>
      POSTGRES_DB: reveal_market
      PGUSER: market_admin
      PGDATABASE: reveal_market
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_admin -d reveal_market"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: reveal-market-redis
    user: "999:1000"
    restart: unless-stopped
    # mem_swappiness: 0
    # Acts as cache + heartbeat store. Port binding lives in docker-compose.override.yml for local-only access.
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your env file}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: reveal-market-api
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      <<: *backend-env
      RM_ENVIRONMENT: ${RM_ENVIRONMENT:-local}
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: ${RM_HEALTHCHECK_HOST:-localhost}\" http://127.0.0.1:8000/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: reveal-market-worker
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      <<: *backend-env
      # Keep worker footprint light to avoid OOM restarts during sync.
      APP_WORKERS: ${APP_WORKERS:-1}
      UVICORN_WORKERS: 1
      PYTHONUNBUFFERED: 1
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker runs in the background and only reports via logs, so no port mapping.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9100"
      - "prometheus.path=/metrics"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  hedger:
    build:
      context: .
      dockerfile: docker/hedger/Dockerfile
    container_name: reveal-market-hedger
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      RM_ENVIRONMENT: ${RM_ENVIRONMENT:-local}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      streamer:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8090"
      - "prometheus.path=/metrics"
    healthcheck:
      # Keep liveness checks lightweight; deep DB checks are exposed via /healthz/deep.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  relayer:
    build:
      context: .
      dockerfile: docker/relayer/Dockerfile
    container_name: reveal-market-relayer
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      RELAYER_HOST: ${RELAYER_HOST:-0.0.0.0}
      RELAYER_PORT: ${RELAYER_PORT:-8088}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8088"
      - "prometheus.path=/metrics"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${RELAYER_PORT:-8088}/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 192M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_PRICE_STREAMER_URL: ${NEXT_PUBLIC_PRICE_STREAMER_URL:-http://localhost:8100}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-2651420}
        NEXT_PUBLIC_CHAIN_NAME: ${NEXT_PUBLIC_CHAIN_NAME:-Horizen Testnet}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://horizen-testnet.rpc.caldera.xyz/http}
        NEXT_PUBLIC_BLOCK_EXPLORER_URL: ${NEXT_PUBLIC_BLOCK_EXPLORER_URL:-https://horizen-testnet.explorer.caldera.xyz}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_ZEN_TOKEN_ADDRESS: ${NEXT_PUBLIC_ZEN_TOKEN_ADDRESS}
        NEXT_DISABLE_MINIFY: ${NEXT_DISABLE_MINIFY:-false}
    container_name: reveal-market-frontend
    restart: unless-stopped
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=256
      RUNNING_IN_DOCKER: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Prefer IPv4 loopback to avoid IPv6-only DNS resolutions inside Alpine.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      # Next.js performs ISR pre-generation at startup (hundreds of fetchMarketByEventId
      # calls). With start_period: 10s the health check failures counted before ISR was done,
      # causing 3 SIGTERM restarts (ExitCode 0). 90s gives ample room even on cold starts.
      start_period: 90s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

  prover:
    build:
      context: .
      dockerfile: docker/prover/Dockerfile
    container_name: reveal-market-prover
    restart: unless-stopped
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    volumes:
      - ./prover/circuits:/app/circuits:ro
    environment:
      TZ: UTC
      PROVER_LISTEN_ADDR: 0.0.0.0:8085
      PROVER_HEARTBEAT_SECONDS: 60
      PYTHONUNBUFFERED: 1
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8085"
      - "prometheus.path=/metrics"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  streamer:
    build:
      context: .
      dockerfile: docker/streamer/Dockerfile
    container_name: reveal-market-streamer
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      RM_ENVIRONMENT: ${RM_ENVIRONMENT:-local}
      STREAMER_API_HOST: 0.0.0.0
      STREAMER_API_PORT: 8100
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8100"
      - "prometheus.path=/metrics"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---- Monitoring ----

  # Item 10: alertmanager-discord sidecar — converts Alertmanager's JSON
  # webhook payload to Discord embed format and POSTs to DISCORD_WEBHOOK.
  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    container_name: reveal-market-alertmanager-discord
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK: ${DISCORD_ALERT_WEBHOOK_URL:?Set DISCORD_ALERT_WEBHOOK_URL in your env file}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
        reservations:
          cpus: "0.05"
          memory: 16M

  # Alertmanager — receives fired rules from Prometheus and forwards to the
  # alertmanager-discord sidecar at http://alertmanager-discord:9094.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: reveal-market-alertmanager
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.local}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
      - "--log.level=warn"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - alertmanager-discord
    healthcheck:
      # Checks alertmanager's own API AND that the discord sidecar is reachable.
      # busybox wget can't handle dual-stack DNS, so resolve IPv4 via nslookup first.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null 2>&1 && DISC_IP=$(nslookup alertmanager-discord 2>/dev/null | awk '/^Address:.*\\./{print $2}' | grep -v 127 | head -1) && wget -qO /dev/null http://${DISC_IP}:9094/ 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: reveal-market-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts:/etc/prometheus/alerts:ro
      - ./docker/prometheus/recording_rules:/etc/prometheus/recording_rules:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:11.5.2
    container_name: reveal-market-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform_overview.json
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: reveal-market-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://market_admin:<REDACTED>@postgres:5432/reveal_market?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics | head -1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: reveal-market-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9121/metrics | head -1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

volumes:
  # Named volumes keep state between docker compose up/down cycles.
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
