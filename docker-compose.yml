name: reveal-market

# Optional environment anchor shared by API + worker so we do not duplicate
# connection strings. Override values via .env / CLI if needed.

x-backend-env: &backend-env
  MODE: ${MODE:-prod}
  RM_DATABASE_URL: postgresql+psycopg2://market_admin:<REDACTED>@postgres:5432/reveal_market
  RM_REDIS_URL: redis://redis:6379/0
  RM_POLYMARKET_API_BASE: https://gamma-api.polymarket.com

services:
  postgres:
    image: postgres:15-alpine
    container_name: reveal-market-postgres
    restart: unless-stopped
    # Primary datastore for both API + worker. The binded volume keeps data
    # across container restarts so migrations/tests do not blow away fixtures.
    # Default credentials are baked into the sample data only. Override in prod.
    environment:
      POSTGRES_USER: market_admin
      POSTGRES_PASSWORD: <REDACTED>
      POSTGRES_DB: reveal_market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_admin -d reveal_market"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: reveal-market-redis
    restart: unless-stopped
    # Acts as cache + heartbeat store. We expose the default port so developers
    # can inspect metrics with redis-cli locally if needed.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: reveal-market-api
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-env
      RM_ENVIRONMENT: local
      APP_WORKERS: ${APP_WORKERS:-2}
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      proover:
        condition: service_healthy
    # Expose FastAPI on the host so docs + frontend can talk to it directly.
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 384M

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: reveal-market-worker
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-env
      RM_POLYMARKET_CLOSED_FILTER: "false"
      RM_POLL_INTERVAL_SECONDS: 60
      RM_POLYMARKET_TIMEOUT_SECONDS: 10
      RM_API_BASE_URL: http://api:8000
      RM_MARKETS_CACHE_LIMIT: 18
      RM_PROVER_ENABLED: ${RM_PROVER_ENABLED:-false}
      RM_PROVER_BASE_URL: http://proover:8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker runs in the background and only reports via logs, so no port mapping.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 384M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        RM_API_BASE_URL: http://api:8000
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        RUNNING_IN_DOCKER: "true"
    container_name: reveal-market-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      RM_API_BASE_URL: http://api:8000
      RUNNING_IN_DOCKER: "true"
      DOCS_HOST: docs.revealmarket.xyz
    depends_on:
      api:
        condition: service_healthy
    # Public entrypoint for the stack. Keep host mapping so preview builds work.
    ports:
      - "3000:3000"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  proover:
    build:
      context: .
      dockerfile: docker/proover/Dockerfile
    container_name: reveal-market-proover
    restart: unless-stopped
    volumes:
      - ./proover/circuits:/app/circuits:ro
    environment:
      PROVER_LISTEN_ADDR: 0.0.0.0:8085
      PROVER_HEARTBEAT_SECONDS: 60
      PROVER_VERSION: ${PROVER_VERSION:-dev}
      PROVER_CIRCUIT_HASH: ${PROVER_CIRCUIT_HASH:-0x0}
      PROVER_BACKEND: ${PROVER_BACKEND:-groth16}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  # Named volumes keep state between docker compose up/down cycles.
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
