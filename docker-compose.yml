name: reveal-market

# Optional environment anchor shared by API + worker so we do not duplicate
# connection strings. Override values via .env / CLI if needed.

x-backend-env: &backend-env
  MODE: ${MODE}
  RM_DATABASE_URL: ${RM_DATABASE_URL}
  RM_REDIS_URL: ${RM_REDIS_URL}
  RM_POLYMARKET_API_BASE: ${RM_POLYMARKET_API_BASE}

services:
  postgres:
    image: postgres:15-alpine
    container_name: reveal-market-postgres
    restart: unless-stopped
    # mem_swappiness: 0
    # command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    # Primary datastore for both API + worker. The binded volume keeps data
    # across container restarts so migrations/tests do not blow away fixtures.
    # Default credentials are baked into the sample data only. Override in prod.
    environment:
      POSTGRES_USER: market_admin
      POSTGRES_PASSWORD: <REDACTED>
      POSTGRES_DB: reveal_market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_admin -d reveal_market"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: reveal-market-redis
    restart: unless-stopped
    # mem_swappiness: 0
    # Acts as cache + heartbeat store. We expose the default port so developers
    # can inspect metrics with redis-cli locally if needed.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-api
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    environment:
      <<: *backend-env
      RM_ENVIRONMENT: local
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
      HOST: 0.0.0.0
      # Surface CORS/host controls from env files into the API container.
      RM_ALLOWED_HOSTS: ${RM_ALLOWED_HOSTS}
      RM_CORS_ALLOW_ORIGINS: ${RM_CORS_ALLOW_ORIGINS}
      RM_CORS_ALLOW_METHODS: ${RM_CORS_ALLOW_METHODS}
      RM_CORS_ALLOW_HEADERS: ${RM_CORS_ALLOW_HEADERS}
      RM_CORS_ALLOW_CREDENTIALS: ${RM_CORS_ALLOW_CREDENTIALS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Expose FastAPI on the host so docs + frontend can talk to it directly.
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://api:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-worker
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    environment:
      <<: *backend-env
      RM_POLYMARKET_CLOSED_FILTER: "false"
      RM_POLL_INTERVAL_SECONDS: 60
      RM_POLYMARKET_TIMEOUT_SECONDS: 10
      RM_API_BASE_URL: ${RM_API_BASE_URL}
      RM_MARKETS_CACHE_LIMIT: 18
      RM_PROVER_ENABLED: ${RM_PROVER_ENABLED}
      RM_PROVER_BASE_URL: ${RM_PROVER_BASE_URL}
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker runs in the background and only reports via logs, so no port mapping.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  hedger:
    build:
      context: .
      dockerfile: docker/hedger/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-hedger
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    environment:
      MODE: ${MODE}
      HEDGER_DATABASE_URL: ${HEDGER_DATABASE_URL}
      HEDGER_REDIS_URL: ${HEDGER_REDIS_URL}
      HEDGER_POLYMARKET_API_BASE: ${HEDGER_POLYMARKET_API_BASE}
      HEDGER_FX_FEED_URL: ${HEDGER_FX_FEED_URL}
      HEDGER_FX_HAIRCUT_BPS: ${HEDGER_FX_HAIRCUT_BPS}
      HEDGER_VAULT_RPC_URL: ${HEDGER_VAULT_RPC_URL}
      HEDGER_VAULT_PRIVATE_KEY: ${HEDGER_VAULT_PRIVATE_KEY}
      HEDGER_VAULT_SENDER_ADDRESS: ${HEDGER_VAULT_SENDER_ADDRESS}
      HEDGER_LP_VAULT_ADDRESS: ${HEDGER_LP_VAULT_ADDRESS}
      HEDGER_VAULT_CHAIN_ID: ${HEDGER_VAULT_CHAIN_ID}
      HEDGER_VAULT_GAS_PRICE_GWEI: ${HEDGER_VAULT_GAS_PRICE_GWEI}
      HEDGER_API_HOST: 0.0.0.0
      HEDGER_API_PORT: 8090
      HEDGER_PROVER_BASE_URL: ${HEDGER_PROVER_BASE_URL}
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PRICE_STREAMER_URL: ${NEXT_PUBLIC_PRICE_STREAMER_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_WALLET_CHAINS: ${NEXT_PUBLIC_WALLET_CHAINS}
    container_name: reveal-market-frontend
    restart: unless-stopped
    mem_swappiness: 0
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      # These are mostly for server-side code (if you use them there),
      # NOT for client-side code. Client uses the build-time values above.
      RM_API_BASE_URL: ${RM_API_BASE_URL}
      RM_OFFLINE_API_BASE_URL: ${RM_OFFLINE_API_BASE_URL}
      SITEMAP_API_BASE_URL: ${SITEMAP_API_BASE_URL}
      LANDING_ACCESS_CODE: ${LANDING_ACCESS_CODE}
      STREAMER_INTERNAL_URL: ${STREAMER_INTERNAL_URL}
    depends_on:
      api:
        condition: service_healthy
    # Public entrypoint for the stack. Keep host mapping so preview builds work.
    ports:
      - "3000:3000"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

  caddy:
    image: caddy:2
    container_name: reveal-market-caddy
    restart: unless-stopped
    mem_swappiness: 0
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M

  prover:
    build:
      context: .
      dockerfile: docker/prover/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-prover
    restart: unless-stopped
    mem_swappiness: 0
    volumes:
      - ./prover/circuits:/app/circuits:ro
    environment:
      PROVER_LISTEN_ADDR: 0.0.0.0:8085
      PROVER_HEARTBEAT_SECONDS: 60
      PROVER_VERSION: ${PROVER_VERSION}
      PROVER_CIRCUIT_HASH: ${PROVER_CIRCUIT_HASH}
      PROVER_BACKEND: ${PROVER_BACKEND}
      PYTHONUNBUFFERED: 1
    ports:
      - "8085:8085"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          cpus: "0.5"
          memory: 192M

  price-streamer:
    build:
      context: .
      dockerfile: docker/price-streamer/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-price-streamer
    restart: unless-stopped
    mem_swappiness: 0
    environment:
      STREAMER_REDIS_URL: ${STREAMER_REDIS_URL}
      STREAMER_CLOB_WS_URL: ${STREAMER_CLOB_WS_URL}
      STREAMER_CLOB_REST_MARKETS_URL: ${STREAMER_CLOB_REST_MARKETS_URL}
      STREAMER_INTERNAL_URL: ${STREAMER_INTERNAL_URL}
      STREAMER_FX_FEED_URL: ${STREAMER_FX_FEED_URL}
      STREAMER_FX_WS_URL: ${STREAMER_FX_WS_URL}
      STREAMER_FX_WS_STALE_TTL_SECONDS: ${STREAMER_FX_WS_STALE_TTL_SECONDS}
      STREAMER_WORSEN_PERCENT: ${STREAMER_WORSEN_PERCENT}
      STREAMER_HAIRCUT_PERCENT: ${STREAMER_HAIRCUT_PERCENT}
      STREAMER_RAKE_PERCENT: ${STREAMER_RAKE_PERCENT}
      STREAMER_API_HOST: 0.0.0.0
      STREAMER_API_PORT: 8100
      LOG_LEVEL: ${STREAMER_LOG_LEVEL}
      STREAMER_CORS_ALLOW_ORIGINS: ${STREAMER_CORS_ALLOW_ORIGINS}
      STREAMER_CORS_ALLOW_METHODS: ${STREAMER_CORS_ALLOW_METHODS}
      STREAMER_CORS_ALLOW_HEADERS: ${STREAMER_CORS_ALLOW_HEADERS}
      STREAMER_CORS_ALLOW_CREDENTIALS: ${STREAMER_CORS_ALLOW_CREDENTIALS}
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  # Named volumes keep state between docker compose up/down cycles.
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
