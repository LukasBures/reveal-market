name: reveal-market

# Optional environment anchor shared by API + worker so we do not duplicate
# connection strings. Override values via .env / CLI if needed.

x-backend-env: &backend-env
  TZ: UTC
  RM_ENVIRONMENT: ${RM_ENVIRONMENT}
  RM_DATABASE_URL: ${RM_DATABASE_URL}
  RM_REDIS_URL: ${RM_REDIS_URL}
  RM_POLYMARKET_API_BASE: ${RM_POLYMARKET_API_BASE}

services:
  postgres:
    image: postgres:15-alpine
    container_name: reveal-market-postgres
    restart: unless-stopped
    command:
      - "postgres"
      # ---- Memory ----
      # ~25% of container memory (4G)
      - "-c"
      - "shared_buffers=1GB"
      # Per-sort / per-hash; keep conservative to avoid OOM
      - "-c"
      - "work_mem=16MB"
      # Used for vacuum, index builds, retention cleanup
      - "-c"
      - "maintenance_work_mem=512MB"
      # ---- WAL & Checkpoints ----
      - "-c"
      - "max_wal_size=6GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "wal_buffers=64MB"
      # ---- Parallelism / CPU ----
      # Match Docker CPU limits
      - "-c"
      - "max_connections=100"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_worker_processes=4"
      # ---- Planner / IO ----
      # Assume SSD / cloud disk
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_cache_size=1.5GB"
      # ---- Autovacuum (important for retention deletes) ----
      - "-c"
      - "autovacuum_max_workers=3"
      - "-c"
      - "autovacuum_naptime=30s"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.02"
      # ---- Safety / Observability ----
      - "-c"
      - "log_min_duration_statement=500ms"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_autovacuum_min_duration=1s"
    environment:
      POSTGRES_USER: market_admin
      POSTGRES_PASSWORD: <REDACTED>
      POSTGRES_DB: reveal_market
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_admin -d reveal_market"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: reveal-market-redis
    restart: unless-stopped
    # mem_swappiness: 0
    # Acts as cache + heartbeat store. Port binding lives in docker-compose.override.yml for local-only access.
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your env file}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-api
    restart: unless-stopped
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      <<: *backend-env
      RM_ENVIRONMENT: ${RM_ENVIRONMENT:-local}
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: ${RM_HEALTHCHECK_HOST:-localhost}\" http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-worker
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      <<: *backend-env
      RM_DATABASE_ASYNC_URL: ${RM_DATABASE_ASYNC_URL}
      RM_POLYMARKET_ONLY_OPEN_MARKETS: "true"
      RM_POLYMARKET_MAX_PAGES: ${RM_POLYMARKET_MAX_PAGES}
      RM_POLYMARKET_PAGE_SIZE: ${RM_POLYMARKET_PAGE_SIZE}
      RM_POLL_INTERVAL_SECONDS: 300
      RM_POLYMARKET_TIMEOUT_SECONDS: 10
      RM_MARKETS_CACHE_LIMIT: 18
      RM_SUMMARY_ENABLED: ${RM_SUMMARY_ENABLED}
      RM_PROVER_ENABLED: ${RM_PROVER_ENABLED}
      RM_PROVER_BASE_URL: ${RM_PROVER_BASE_URL}
      # Keep worker footprint light to avoid OOM restarts during sync.
      APP_WORKERS: ${APP_WORKERS:-1}
      UVICORN_WORKERS: 1
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker runs in the background and only reports via logs, so no port mapping.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  hedger:
    build:
      context: .
      dockerfile: docker/hedger/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    profiles: ["hedger"]
    container_name: reveal-market-hedger
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      HEDGER_ENVIRONMENT: ${RM_ENVIRONMENT:-dev}
      HEDGER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: UTC
      RM_DATABASE_URL: ${RM_DATABASE_URL:-postgresql+psycopg2://market_admin:<REDACTED>@postgres:5432/reveal_market}
      HEDGER_REDIS_URL: ${HEDGER_REDIS_URL}
      HEDGER_POLYMARKET_API_BASE: ${HEDGER_POLYMARKET_API_BASE}
      HEDGER_FX_FEED_URL: ${HEDGER_FX_FEED_URL}
      HEDGER_FX_FEED_ALT_URL: ${HEDGER_FX_FEED_ALT_URL:-}
      HEDGER_FX_HAIRCUT_BPS: ${HEDGER_FX_HAIRCUT_BPS}
      HEDGER_RISK_MAX_GLOBAL_EXPOSURE_USD: ${HEDGER_RISK_MAX_GLOBAL_EXPOSURE_USD}
      HEDGER_RISK_MAX_PER_MARKET_USD: ${HEDGER_RISK_MAX_PER_MARKET_USD}
      HEDGER_FLOAT_MIN_ZEN: ${HEDGER_FLOAT_MIN_ZEN}
      HEDGER_MAX_SLIPPAGE_BPS: ${HEDGER_MAX_SLIPPAGE_BPS:-100}
      HEDGER_PRICING_SIGNER_ADDRESS: ${HEDGER_PRICING_SIGNER_ADDRESS:-}
      HEDGER_PROVER_BASE_URL: ${HEDGER_PROVER_BASE_URL}
      HEDGER_BRIDGE_ENDPOINT: ${HEDGER_BRIDGE_ENDPOINT}
      HEDGER_LP_VAULT_ADDRESS: ${HEDGER_LP_VAULT_ADDRESS}
      HEDGER_VAULT_RPC_URL: ${HEDGER_VAULT_RPC_URL}
      HEDGER_VAULT_PRIVATE_KEY: ${HEDGER_VAULT_PRIVATE_KEY}
      HEDGER_VAULT_SENDER_ADDRESS: ${HEDGER_VAULT_SENDER_ADDRESS}
      HEDGER_VAULT_CHAIN_ID: ${HEDGER_VAULT_CHAIN_ID}
      HEDGER_VAULT_GAS_PRICE_GWEI: ${HEDGER_VAULT_GAS_PRICE_GWEI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      streamer:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  relayer:
    build:
      context: .
      dockerfile: docker/relayer/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-relayer
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}
      RELAYER_ESCROW_ADDRESS: ${RELAYER_ESCROW_ADDRESS}
      RELAYER_HOST: ${RELAYER_HOST:-0.0.0.0}
      RELAYER_PORT: ${RELAYER_PORT:-8088}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${RELAYER_PORT:-8088}/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 192M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_PRICE_STREAMER_URL: ${NEXT_PUBLIC_PRICE_STREAMER_URL:-http://localhost:8100}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_WALLET_CHAINS: ${NEXT_PUBLIC_WALLET_CHAINS}
        NEXT_PUBLIC_ZEN_TOKEN_ADDRESS: ${NEXT_PUBLIC_ZEN_TOKEN_ADDRESS}
        NEXT_DISABLE_MINIFY: ${NEXT_DISABLE_MINIFY:-false}
    container_name: reveal-market-frontend
    restart: unless-stopped
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=256
      RUNNING_IN_DOCKER: "true"
      LANDING_ACCESS_CODE: ${LANDING_ACCESS_CODE}
      NEXT_PUBLIC_ZEN_TOKEN_ADDRESS: ${NEXT_PUBLIC_ZEN_TOKEN_ADDRESS}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Prefer IPv4 loopback to avoid IPv6-only DNS resolutions inside Alpine.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

  caddy:
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
    image: reveal-market-caddy
    container_name: reveal-market-caddy
    restart: unless-stopped
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: UTC
      CADDY_TLS_PROFILE: ${CADDY_TLS_PROFILE}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2019/config/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M

  prover:
    build:
      context: .
      dockerfile: docker/prover/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-prover
    restart: unless-stopped
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    volumes:
      - ./prover/circuits:/app/circuits:ro
    environment:
      TZ: UTC
      PROVER_LISTEN_ADDR: 0.0.0.0:8085
      PROVER_HEARTBEAT_SECONDS: 60
      PROVER_VERSION: ${PROVER_VERSION}
      PROVER_CIRCUIT_HASH: ${PROVER_CIRCUIT_HASH}
      PROVER_BACKEND: ${PROVER_BACKEND}
      PYTHONUNBUFFERED: 1
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  streamer:
    build:
      context: .
      dockerfile: docker/streamer/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: reveal-market-streamer
    restart: unless-stopped
    init: true
    mem_swappiness: 0
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      STREAMER_REDIS_URL: ${STREAMER_REDIS_URL}
      STREAMER_CLOB_WS_URL: ${STREAMER_CLOB_WS_URL}
      STREAMER_FX_PRIMARY_REST_URL: ${STREAMER_FX_PRIMARY_REST_URL}
      STREAMER_FX_SECONDARY_REST_URL: ${STREAMER_FX_SECONDARY_REST_URL}
      STREAMER_FX_PRIMARY_WS_URL: ${STREAMER_FX_PRIMARY_WS_URL}
      STREAMER_FX_WS_STALE_TTL_SECONDS: ${STREAMER_FX_WS_STALE_TTL_SECONDS}
      STREAMER_WORSEN_PERCENT: ${STREAMER_WORSEN_PERCENT}
      STREAMER_HAIRCUT_PERCENT: ${STREAMER_HAIRCUT_PERCENT}
      STREAMER_RAKE_PERCENT: ${STREAMER_RAKE_PERCENT}
      STREAMER_API_HOST: 0.0.0.0
      STREAMER_API_PORT: 8100
      LOG_LEVEL: ${STREAMER_LOG_LEVEL}
      APP_WORKERS: ${APP_WORKERS:-2}
      UVICORN_WORKERS: 2
      PYTHONUNBUFFERED: 1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  # Named volumes keep state between docker compose up/down cycles.
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
