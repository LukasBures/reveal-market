[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "solmate/=lib/solmate/src/",
    "forge-std/=lib/forge-std/src/"
]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = true
via_ir = true
gas_reports = ["*"]

[profile.ci.fuzz]
runs = 10000
verbosity = 3
via_ir = true
