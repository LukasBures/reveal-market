global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Item 10: Route fired alerts to Alertmanager for Discord delivery.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

rule_files:
  - "/etc/prometheus/alerts/*.yml"
  - "/etc/prometheus/recording_rules/*.yml"

scrape_configs:
  # ---- Application services ----

  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "worker"
    static_configs:
      - targets: ["worker:9100"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "streamer"
    static_configs:
      - targets: ["streamer:8100"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "hedger"
    static_configs:
      - targets: ["hedger:8090"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "relayer"
    static_configs:
      - targets: ["relayer:8088"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "prover"
    static_configs:
      - targets: ["prover:8085"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ---- Infrastructure exporters ----

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ---- Self-monitoring ----

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
