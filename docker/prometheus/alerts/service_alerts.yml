groups:
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: watchdog
        annotations:
          summary: "Alertmanager → Discord pipeline is alive"
          description: "Heartbeat fires every 12h. If this stops arriving, the alerting chain is broken."

  - name: service_availability
    interval: 15s
    rules:
      - alert: ServiceDown
        expr: up{job!~"postgres|redis"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 5 minutes."

      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (rate(api_request_latency_seconds_count{status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(api_request_latency_seconds_count[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "More than 5% of requests are returning 5xx for 5 minutes. Current: {{ $value | humanizePercentage }}."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, job) (rate(api_request_latency_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "95th percentile latency exceeds 2 seconds. Current: {{ $value | humanizeDuration }}."

      - alert: CacheHitRateLow
        expr: |
          (
            sum(rate(api_cache_requests_total{outcome="hit"}[15m]))
            /
            sum(rate(api_cache_requests_total[15m]))
          ) < 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "API cache hit rate below 50%"
          description: "Cache hit rate has been {{ $value | humanizePercentage }} for 30 minutes."

  - name: worker_health
    interval: 15s
    rules:
      - alert: WorkerSyncStale
        expr: |
          changes(worker_sync_cycle_duration_seconds_count{job="worker"}[35m]) == 0
          or absent(worker_sync_cycle_duration_seconds_count{job="worker"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker sync appears stalled"
          description: "No sync cycle completed in the last 35 minutes."

      - alert: ProofQueueDepthCritical
        expr: sum(worker_proof_queue_depth) > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Proof queue depth is critically high"
          description: "{{ $value }} pending proof jobs for more than 5 minutes."

      - alert: SettlementQueueBacklog
        expr: sum(worker_settlement_queue_depth) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Settlement queue has a significant backlog"
          description: "{{ $value }} pending settlement jobs for more than 10 minutes."
