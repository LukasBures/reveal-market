save ""
stop-writes-on-bgsave-error no
appendonly no
maxmemory 2560mb
maxmemory-policy volatile-lru
loglevel warning
# Drop idle connections more reliably on sleepy clients.
tcp-keepalive 300
# Only expose DB 0; clients should not assume multiple DBs exist.
databases 1
# Enable latency monitor for troubleshooting (ms threshold).
latency-monitor-threshold 100
# Allow container-to-container access inside docker-compose; the stack is on a private bridge network.
bind 0.0.0.0
protected-mode yes
