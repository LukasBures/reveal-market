# RDB snapshotting disabled; AOF is the durability mechanism.
save ""
stop-writes-on-bgsave-error no

# Item 4: AOF persistence — survives Redis restarts with at most 1 second of
# data loss. Critical for nonce dedup keys, rate-limit buckets, and proof
# queue locks. appendfsync everysec is the safe default (1s loss max).
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
maxmemory 1300mb
maxmemory-policy volatile-lru
loglevel warning
# Faster dead connection detection (300s -> 60s for Docker bridge networking).
tcp-keepalive 60
# Only expose DB 0; clients should not assume multiple DBs exist.
databases 1
# Enable latency monitor for troubleshooting (ms threshold).
latency-monitor-threshold 100
# Allow container-to-container access inside docker-compose; the stack is on a private bridge network.
bind 0.0.0.0
protected-mode yes

# Lazy-free: offload large key deallocation to background thread.
# Prevents the main event loop from stalling when evicting large JSON payloads.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# Bound total client connections (5 services * ~20 pool connections + headroom).
maxclients 256

# Memory-efficient encodings for small data structures.
hash-max-ziplist-entries 128
hash-max-ziplist-value 256
list-max-listpack-size -2
set-max-intset-entries 512
set-max-listpack-entries 128

# Protect against slow pubsub consumers eating all memory.
client-output-buffer-limit pubsub 32mb 8mb 60
client-output-buffer-limit normal 0 0 0

# Slow log for diagnosing hot commands (>5ms).
slowlog-log-slower-than 5000
slowlog-max-len 128
