name: Setup Python + uv
description: Install Python, uv, and restore the shared uv cache

inputs:
  python-version:
    description: Python version to install
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

    - name: Cache uv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-
