name: Checkout Submodules
description: Initialize git submodules with optional artifacts deploy key

inputs:
  artifacts-deploy-key:
    description: SSH deploy key for the prover/artifacts submodule
    default: ""
  skip-artifacts-submodule:
    description: Whether to skip prover/artifacts submodule initialization
    default: "true"
  skip-zen-lib-submodules:
    description: >
      Skip contracts/zen Foundry library submodules (forge-std, openzeppelin-contracts, solmate).
      Set to true for jobs that do not build Solidity (e.g. prover) to avoid fetching deeply
      nested sub-submodules that are prone to transient GitHub 500 errors.
    default: "false"

runs:
  using: composite
  steps:
    - name: Init submodules (with artifacts key)
      if: inputs.artifacts-deploy-key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.artifacts-deploy-key }}" > ~/.ssh/id_artifacts
        chmod 600 ~/.ssh/id_artifacts
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
        if [ "${{ inputs.skip-artifacts-submodule }}" = "true" ]; then
          git config submodule.prover/artifacts.update none
        fi
        if [ "${{ inputs.skip-zen-lib-submodules }}" = "true" ]; then
          git config submodule."contracts/zen/lib/forge-std".update none
          git config submodule."contracts/zen/lib/openzeppelin-contracts".update none
          git config submodule."contracts/zen/lib/solmate".update none
        fi
        GIT_SSH_COMMAND="ssh -i ~/.ssh/id_artifacts -o IdentitiesOnly=yes" git submodule update --init --recursive

    - name: Init submodules (no key)
      if: inputs.artifacts-deploy-key == ''
      shell: bash
      run: |
        git config submodule.prover/artifacts.update none
        if [ "${{ inputs.skip-zen-lib-submodules }}" = "true" ]; then
          git config submodule."contracts/zen/lib/forge-std".update none
          git config submodule."contracts/zen/lib/openzeppelin-contracts".update none
          git config submodule."contracts/zen/lib/solmate".update none
        fi
        git submodule update --init --recursive
