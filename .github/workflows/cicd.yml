name: Tests + Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  precommit:
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_DEPLOY_KEY: ${{ secrets.ARTIFACTS_DEPLOY_KEY || '' }}
    steps:
      - name: Checkout (main only)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules (with artifacts key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${ARTIFACTS_DEPLOY_KEY}" > ~/.ssh/id_artifacts
          chmod 600 ~/.ssh/id_artifacts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config submodule.prover/artifacts.update none
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_artifacts -o IdentitiesOnly=yes" git submodule update --init --recursive

      - name: Checkout submodules (skip artifacts if no key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY == '' }}
        run: |
          git config submodule.prover/artifacts.update none
          git submodule update --init --recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - name: Install Foundry dependencies (polygon)
        run: |
          set -euo pipefail
          cd contracts/polygon
          if [ ! -d lib/forge-std ] || [ ! -d lib/openzeppelin-contracts ]; then
            forge install --no-git --shallow \
              foundry-rs/forge-std@v1.9.1 \
              openzeppelin/openzeppelin-contracts@v5.0.0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Sync dependencies
        run: |
          uv sync --frozen --no-install-project
          uv sync --project backend/api --extra dev --no-install-project --frozen
          uv sync --project backend/worker --extra dev --no-install-project --frozen
          uv sync --project streamer --extra dev --no-install-project --frozen
          uv sync --project relayer --group dev --no-install-project --frozen
          uv sync --project hedger --extra dev --no-install-project --frozen
      - name: Pre-commit checks
        run: make format

  security:
    needs: precommit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  backend:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync backend dependencies
        run: |
          uv sync --project backend/api --extra dev --no-install-project --frozen
          uv sync --project backend/worker --extra dev --no-install-project --frozen

      - name: Backend tests, OpenAPI, and mypy
        run: ./backend/run_tests.sh


  streamer:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync streamer dependencies
        run: |
          uv sync --project streamer --extra dev --no-install-project --frozen

      - name: Run streamer tests
        env:
          PYTEST_WORKER_COUNT: 4
        run: ./streamer/run_tests.sh

  relayer:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync relayer dependencies
        run: |
          uv sync --project relayer --group dev --no-install-project --frozen

      - name: Relayer tests
        run: ./relayer/run_tests.sh

  hedger:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync hedger dependencies
        run: uv sync --project hedger --extra dev --no-install-project --frozen

      - name: Hedger tests
        env:
          PYTEST_WORKER_COUNT: 4
        working-directory: hedger
        run: ./run_tests.sh

  contracts-zen:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Run Zen contracts suite
        working-directory: contracts/zen
        run: ./run_local.sh

  contracts-polygon:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Run Polygon contracts suite
        working-directory: contracts/polygon
        run: ./run_local.sh

  frontend:
    needs: precommit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint, unit tests, and build
        run: ./frontend/run_tests.sh

      - name: Bundle size budgets
        working-directory: frontend
        run: npm run bundle:check

      - name: Lighthouse CI
        working-directory: frontend
        run: |
          npm run lighthouse:ci


  prover:
    needs: precommit
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_DEPLOY_KEY: ${{ secrets.ARTIFACTS_DEPLOY_KEY || '' }}
      PROVER_ARTIFACTS_URL: ${{ secrets.PROVER_ARTIFACTS_URL || vars.PROVER_ARTIFACTS_URL || '' }}
      PROVER_ARTIFACTS_SHA256: ${{ secrets.PROVER_ARTIFACTS_SHA256 || vars.PROVER_ARTIFACTS_SHA256 || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules (with artifacts key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${ARTIFACTS_DEPLOY_KEY}" > ~/.ssh/id_artifacts
          chmod 600 ~/.ssh/id_artifacts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          if [ -n "${PROVER_ARTIFACTS_URL}" ]; then
            git config submodule.prover/artifacts.update none
          fi
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_artifacts -o IdentitiesOnly=yes" git submodule update --init --recursive

      - name: Checkout submodules (skip artifacts if no key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY == '' }}
        run: |
          git config submodule.prover/artifacts.update none
          git submodule update --init --recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: prover/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rapidsnark binary
        env:
          RAPIDSNARK_VERSION: v0.0.7
        run: |
          set -euo pipefail
          ARCHIVE="rapidsnark-linux-x86_64-${RAPIDSNARK_VERSION}.zip"
          URL="https://github.com/iden3/rapidsnark/releases/download/${RAPIDSNARK_VERSION}/${ARCHIVE}"
          echo "Downloading ${URL}"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/rapidsnark.zip "${URL}"
          unzip -q /tmp/rapidsnark.zip -d /tmp/rapidsnark
          RS_DIR="/tmp/rapidsnark/rapidsnark-linux-x86_64-${RAPIDSNARK_VERSION}"
          echo "${RS_DIR}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${RS_DIR}/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Prepare prover artifacts
        run: |
          set -euo pipefail
          ROOT_DIR="$(pwd)"
          SUBMODULE_BUILD="${ROOT_DIR}/prover/artifacts/prover/circuits/build"
          if [ -n "${PROVER_ARTIFACTS_URL}" ]; then
            cd "${ROOT_DIR}/prover"
            ./scripts/download_artifacts.sh
          elif [ -f "${SUBMODULE_BUILD}/settlement_final.zkey" ]; then
            echo "Seeding prover artifacts from submodule..."
            rm -rf "${ROOT_DIR}/prover/circuits/build"
            mkdir -p "${ROOT_DIR}/prover/circuits"
            cp -a "${SUBMODULE_BUILD}" "${ROOT_DIR}/prover/circuits/"
            # Copy cached verifier files when present
            if [ -d "${ROOT_DIR}/prover/artifacts/contracts/cache" ]; then
              mkdir -p "${ROOT_DIR}/contracts"
              cp -a "${ROOT_DIR}/prover/artifacts/contracts/cache" "${ROOT_DIR}/contracts/"
            fi
            if [ -d "${ROOT_DIR}/prover/artifacts/contracts/zen/cache" ]; then
              mkdir -p "${ROOT_DIR}/contracts/zen"
              cp -a "${ROOT_DIR}/prover/artifacts/contracts/zen/cache" "${ROOT_DIR}/contracts/zen/"
            fi
          else
            echo "No PROVER_ARTIFACTS_URL provided and prover/artifacts submodule missing expected files." >&2
            exit 1
          fi

      - name: Verify prover artifacts
        working-directory: prover
        run: go run ./cmd/verify-artifacts

      - name: Run prover tests
        working-directory: prover
        run: ./run_tests.sh -v


  deploy:
    # Only run deploy if ALL tests passed
    needs:
      - security
      - backend
      - relayer
      - hedger
      - streamer
      - contracts-polygon
      - contracts-zen
      - frontend
      - prover

    # Only deploy on main branch
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Reveal Market production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_SHA: ${{ github.sha }}
          # --- Secrets for generate_env.sh ---
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RM_DATABASE_URL: ${{ secrets.RM_DATABASE_URL }}
          RM_DATABASE_ASYNC_URL: ${{ secrets.RM_DATABASE_ASYNC_URL }}
          RM_PRICING_SIGNER_PRIVATE_KEY: ${{ secrets.RM_PRICING_SIGNER_PRIVATE_KEY }}
          RM_AUTHORIZATION_SIGNER_PRIVATE_KEY: ${{ secrets.RM_AUTHORIZATION_SIGNER_PRIVATE_KEY }}
          RM_WALLET_PRIVATE_KEY: ${{ secrets.RM_WALLET_PRIVATE_KEY }}
          RM_SETTLEMENT_SIGNER_PRIVATE_KEY: ${{ secrets.RM_SETTLEMENT_SIGNER_PRIVATE_KEY }}
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          RELAYER_BEARER_TOKEN: ${{ secrets.RELAYER_BEARER_TOKEN }}
          RELAYER_API_INTERNAL_SECRET: ${{ secrets.RELAYER_API_INTERNAL_SECRET }}
          RM_RELAYER_BEARER_TOKEN: ${{ secrets.RM_RELAYER_BEARER_TOKEN }}
          RM_INTERNAL_API_SECRET: ${{ secrets.RM_INTERNAL_API_SECRET }}
          RM_PROVER_SHARED_SECRET: ${{ secrets.RM_PROVER_SHARED_SECRET }}
          RM_HEDGER_INTERNAL_SECRET: ${{ secrets.RM_HEDGER_INTERNAL_SECRET }}
          HEDGER_ADMIN_INTERNAL_SECRET: ${{ secrets.HEDGER_ADMIN_INTERNAL_SECRET }}
          HEDGER_VAULT_PRIVATE_KEY: ${{ secrets.HEDGER_VAULT_PRIVATE_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          CONTACT_TURNSTILE_SECRET: ${{ secrets.CONTACT_TURNSTILE_SECRET }}
          CONTACT_DISCORD_WEBHOOK_URL: ${{ secrets.CONTACT_DISCORD_WEBHOOK_URL }}
          # --- Variables (non-secret, deployment-specific) ---
          RM_RPC_URL: ${{ vars.RM_RPC_URL }}
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          RM_FACTORY_ADDRESS: ${{ vars.RM_FACTORY_ADDRESS }}
          RM_PROTOCOL_POOL_ADDRESS: ${{ vars.RM_PROTOCOL_POOL_ADDRESS }}
          RM_RELAYER_ESCROW_ADDRESS: ${{ vars.RM_RELAYER_ESCROW_ADDRESS }}
          RM_MARKET_IMPLEMENTATION_ADDRESS: ${{ vars.RM_MARKET_IMPLEMENTATION_ADDRESS }}
          RM_VERIFIER_ADDRESS: ${{ vars.RM_VERIFIER_ADDRESS }}
          RM_AUTHORIZATION_SIGNER: ${{ vars.RM_AUTHORIZATION_SIGNER }}
          RM_ORACLE_ADDRESS: ${{ vars.RM_ORACLE_ADDRESS }}
          ZEN_TOKEN_ADDRESS: ${{ vars.ZEN_TOKEN_ADDRESS }}
          RM_WALLET_ADDRESS: ${{ vars.RM_WALLET_ADDRESS }}
          PROVER_CIRCUIT_HASH: ${{ vars.PROVER_CIRCUIT_HASH }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CHAIN_ID: ${{ vars.NEXT_PUBLIC_CHAIN_ID }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_BLOCK_EXPLORER_URL: ${{ vars.NEXT_PUBLIC_BLOCK_EXPLORER_URL }}
          CONTACT_TURNSTILE_SITE_KEY: ${{ vars.CONTACT_TURNSTILE_SITE_KEY }}
          PROVER_ARTIFACTS_SSH_KEY_PATH: ${{ vars.PROVER_ARTIFACTS_SSH_KEY_PATH }}
          PRICING_SIGNER_ADDRESS: ${{ vars.PRICING_SIGNER_ADDRESS }}
        with:
          host: 159.69.29.255
          username: reveal
          port: 2222
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: >-
            GITHUB_SHA,
            REDIS_PASSWORD,RM_DATABASE_URL,RM_DATABASE_ASYNC_URL,
            RM_PRICING_SIGNER_PRIVATE_KEY,RM_AUTHORIZATION_SIGNER_PRIVATE_KEY,
            RM_WALLET_PRIVATE_KEY,RM_SETTLEMENT_SIGNER_PRIVATE_KEY,
            RELAYER_PRIVATE_KEY,RELAYER_BEARER_TOKEN,RELAYER_API_INTERNAL_SECRET,
            RM_RELAYER_BEARER_TOKEN,RM_INTERNAL_API_SECRET,RM_PROVER_SHARED_SECRET,
            RM_HEDGER_INTERNAL_SECRET,HEDGER_ADMIN_INTERNAL_SECRET,
            HEDGER_VAULT_PRIVATE_KEY,GRAFANA_ADMIN_PASSWORD,CF_API_TOKEN,
            DEPLOYER_KEY,CONTACT_TURNSTILE_SECRET,CONTACT_DISCORD_WEBHOOK_URL,
            RM_RPC_URL,CHAIN_ID,
            RM_FACTORY_ADDRESS,RM_PROTOCOL_POOL_ADDRESS,RM_RELAYER_ESCROW_ADDRESS,
            RM_MARKET_IMPLEMENTATION_ADDRESS,RM_VERIFIER_ADDRESS,
            RM_AUTHORIZATION_SIGNER,RM_ORACLE_ADDRESS,ZEN_TOKEN_ADDRESS,
            RM_WALLET_ADDRESS,PROVER_CIRCUIT_HASH,
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID,NEXT_PUBLIC_GA_MEASUREMENT_ID,
            NEXT_PUBLIC_CHAIN_ID,NEXT_PUBLIC_RPC_URL,NEXT_PUBLIC_BLOCK_EXPLORER_URL,
            CONTACT_TURNSTILE_SITE_KEY,PROVER_ARTIFACTS_SSH_KEY_PATH,
            PRICING_SIGNER_ADDRESS
          script: |
            set -euo pipefail
            echo ">>> Pull latest code"
            cd ~/apps/reveal-market
            export MAIN_REPO_SSH_KEY_PATH="${{ vars.MAIN_REPO_SSH_KEY_PATH }}"
            # Expand leading ~ in key paths if provided.
            if [ -n "${MAIN_REPO_SSH_KEY_PATH:-}" ]; then
              case "${MAIN_REPO_SSH_KEY_PATH}" in
                "~/"*) MAIN_REPO_SSH_KEY_PATH="${HOME}/${MAIN_REPO_SSH_KEY_PATH#"~/"}" ;;
              esac
            fi
            if [ -n "${PROVER_ARTIFACTS_SSH_KEY_PATH:-}" ]; then
              case "${PROVER_ARTIFACTS_SSH_KEY_PATH}" in
                "~/"*) PROVER_ARTIFACTS_SSH_KEY_PATH="${HOME}/${PROVER_ARTIFACTS_SSH_KEY_PATH#"~/"}" ;;
              esac
            fi
            MAIN_GIT_SSH_COMMAND=""
            if [ -n "${MAIN_REPO_SSH_KEY_PATH:-}" ] && [ -f "${MAIN_REPO_SSH_KEY_PATH}" ]; then
              MAIN_GIT_SSH_COMMAND="ssh -i ${MAIN_REPO_SSH_KEY_PATH} -o IdentitiesOnly=yes"
            elif [ -f "${HOME}/.ssh/reveal-market-gh-deploy" ]; then
              MAIN_GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/reveal-market-gh-deploy -o IdentitiesOnly=yes"
            fi
            SUBMODULE_GIT_SSH_COMMAND=""
            if [ -n "${PROVER_ARTIFACTS_SSH_KEY_PATH:-}" ] && [ -f "${PROVER_ARTIFACTS_SSH_KEY_PATH}" ]; then
              SUBMODULE_GIT_SSH_COMMAND="ssh -i ${PROVER_ARTIFACTS_SSH_KEY_PATH} -o IdentitiesOnly=yes"
            else
              echo "Artifacts SSH key missing at ${PROVER_ARTIFACTS_SSH_KEY_PATH:-<unset>}; submodule fetch may fail." >&2
            fi
            git status --short
            if ! git diff --quiet; then
              echo "Working tree dirty. Stash or commit changes before deploying." >&2
              exit 1
            fi
            mkdir -p ~/.ssh
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
            if [ -n "${MAIN_GIT_SSH_COMMAND:-}" ]; then
              GIT_SSH_COMMAND="${MAIN_GIT_SSH_COMMAND}" git fetch origin "${GITHUB_SHA}"
            else
              git fetch origin "${GITHUB_SHA}"
            fi
            git checkout "${GITHUB_SHA}"

            git submodule sync --recursive
            git -c submodule.prover/artifacts.update=none submodule update --init --recursive
            if [ -n "${SUBMODULE_GIT_SSH_COMMAND:-}" ]; then
              GIT_SSH_COMMAND="${SUBMODULE_GIT_SSH_COMMAND}" git submodule update --init --recursive prover/artifacts
            else
              git submodule update --init --recursive prover/artifacts
            fi
            if ! command -v git-lfs >/dev/null 2>&1; then
              echo ">>> Installing git-lfs for prover artifacts"
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y git-lfs
              else
                echo "git-lfs is missing and apt-get is not available." >&2
                exit 1
              fi
            fi
            if [ -n "${SUBMODULE_GIT_SSH_COMMAND:-}" ]; then
              GIT_SSH_COMMAND="${SUBMODULE_GIT_SSH_COMMAND}" git -C prover/artifacts lfs pull
            else
              git -C prover/artifacts lfs pull
            fi

            echo ">>> Generate .env.production from CI secrets/variables"
            chmod +x scripts/generate_env.sh
            ./scripts/generate_env.sh .env.production

            echo ">>> Run production deployment script"
            chmod +x run_prod.sh
            ./run_prod.sh

            echo ">>> Deployment complete"

      - name: Purge Cloudflare cache
        if: success()
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
