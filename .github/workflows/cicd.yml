name: Tests + Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  precommit:
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_DEPLOY_KEY: ${{ secrets.ARTIFACTS_DEPLOY_KEY || '' }}
    steps:
      - name: Checkout (main only)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules (with artifacts key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${ARTIFACTS_DEPLOY_KEY}" > ~/.ssh/id_artifacts
          chmod 600 ~/.ssh/id_artifacts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_artifacts -o IdentitiesOnly=yes" git submodule update --init --recursive

      - name: Checkout submodules (skip artifacts if no key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY == '' }}
        run: |
          git config submodule.prover/artifacts.update none
          git submodule update --init --recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - name: Install Foundry dependencies (polygon)
        run: |
          set -euo pipefail
          cd contracts/polygon
          if [ ! -d lib/forge-std ] || [ ! -d lib/openzeppelin-contracts ]; then
            forge install --no-git --shallow \
              foundry-rs/forge-std@v1.9.1 \
              openzeppelin/openzeppelin-contracts@v5.0.0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Sync dependencies
        run: |
          uv sync --frozen --no-install-project
          uv sync --project backend/api --extra dev --no-install-project --frozen
          uv sync --project backend/worker --extra dev --no-install-project --frozen
          uv sync --project streamer --extra dev --no-install-project --frozen
          uv sync --project relayer --group dev --no-install-project --frozen
          uv sync --project hedger --extra dev --no-install-project --frozen
      - name: Pre-commit checks
        run: uv run pre-commit run --all-files

  backend:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync backend dependencies
        run: |
          uv sync --project backend/api --extra dev --no-install-project --frozen
          uv sync --project backend/worker --extra dev --no-install-project --frozen

      - name: Backend tests, OpenAPI, and mypy
        run: ./backend/run_tests.sh


  streamer:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync streamer dependencies
        run: |
          uv sync --project streamer --extra dev --no-install-project --frozen

      - name: Run streamer tests
        env:
          PYTEST_WORKER_COUNT: 4
        run: ./streamer/run_tests.sh

  relayer:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync relayer dependencies
        run: |
          uv sync --project relayer --group dev --no-install-project --frozen

      - name: Relayer tests
        run: ./relayer/run_tests.sh

  hedger:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'backend/api/uv.lock', 'backend/worker/uv.lock', 'streamer/uv.lock', 'relayer/uv.lock', 'hedger/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync hedger dependencies
        run: uv sync --project hedger --extra dev --no-install-project --frozen

      - name: Hedger tests
        env:
          PYTEST_WORKER_COUNT: 4
        working-directory: hedger
        run: ./run_tests.sh

  contracts-polygon:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Install Foundry dependencies (polygon)
        working-directory: contracts/polygon
        run: |
          if [ ! -d lib/forge-std ] || [ ! -d lib/openzeppelin-contracts ]; then
            forge install --no-git --shallow \
              foundry-rs/forge-std@v1.9.1 \
              openzeppelin/openzeppelin-contracts@v5.0.0
          fi

      - name: Run Polygon contracts suite
        working-directory: contracts/polygon
        run: ./run_local.sh

  contracts-zen:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Run Zen contracts suite
        working-directory: contracts/zen
        run: ./run_local.sh

  frontend:
    needs: precommit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint, unit tests, and build
        run: ./frontend/run_tests.sh


  prover:
    needs: precommit
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_DEPLOY_KEY: ${{ secrets.ARTIFACTS_DEPLOY_KEY || '' }}
      PROVER_ARTIFACTS_URL: ${{ secrets.PROVER_ARTIFACTS_URL || vars.PROVER_ARTIFACTS_URL || '' }}
      PROVER_ARTIFACTS_SHA256: ${{ secrets.PROVER_ARTIFACTS_SHA256 || vars.PROVER_ARTIFACTS_SHA256 || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules (with artifacts key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${ARTIFACTS_DEPLOY_KEY}" > ~/.ssh/id_artifacts
          chmod 600 ~/.ssh/id_artifacts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_artifacts -o IdentitiesOnly=yes" git submodule update --init --recursive

      - name: Checkout submodules (skip artifacts if no key)
        if: ${{ env.ARTIFACTS_DEPLOY_KEY == '' }}
        run: |
          git config submodule.prover/artifacts.update none
          git submodule update --init --recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: prover/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rapidsnark binary
        env:
          RAPIDSNARK_VERSION: v0.0.7
        run: |
          set -euo pipefail
          ARCHIVE="rapidsnark-linux-x86_64-${RAPIDSNARK_VERSION}.zip"
          URL="https://github.com/iden3/rapidsnark/releases/download/${RAPIDSNARK_VERSION}/${ARCHIVE}"
          echo "Downloading ${URL}"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/rapidsnark.zip "${URL}"
          unzip -q /tmp/rapidsnark.zip -d /tmp/rapidsnark
          RS_DIR="/tmp/rapidsnark/rapidsnark-linux-x86_64-${RAPIDSNARK_VERSION}"
          echo "${RS_DIR}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${RS_DIR}/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Prepare prover artifacts
        run: |
          set -euo pipefail
          ROOT_DIR="$(pwd)"
          SUBMODULE_BUILD="${ROOT_DIR}/prover/artifacts/prover/circuits/build"
          if [ -n "${PROVER_ARTIFACTS_URL}" ]; then
            cd "${ROOT_DIR}/prover"
            ./scripts/download_artifacts.sh
          elif [ -f "${SUBMODULE_BUILD}/settlement_final.zkey" ]; then
            echo "Seeding prover artifacts from submodule..."
            rm -rf "${ROOT_DIR}/prover/circuits/build"
            mkdir -p "${ROOT_DIR}/prover/circuits"
            cp -a "${SUBMODULE_BUILD}" "${ROOT_DIR}/prover/circuits/"
            # Copy cached verifier files when present
            if [ -d "${ROOT_DIR}/prover/artifacts/contracts/cache" ]; then
              mkdir -p "${ROOT_DIR}/contracts"
              cp -a "${ROOT_DIR}/prover/artifacts/contracts/cache" "${ROOT_DIR}/contracts/"
            fi
            if [ -d "${ROOT_DIR}/prover/artifacts/contracts/zen/cache" ]; then
              mkdir -p "${ROOT_DIR}/contracts/zen"
              cp -a "${ROOT_DIR}/prover/artifacts/contracts/zen/cache" "${ROOT_DIR}/contracts/zen/"
            fi
          else
            echo "No PROVER_ARTIFACTS_URL provided and prover/artifacts submodule missing expected files." >&2
            exit 1
          fi

      - name: Verify prover artifacts
        working-directory: prover
        run: go run ./cmd/verify-artifacts

      - name: Run prover tests
        working-directory: prover
        run: ./run_tests.sh -v


  deploy:
    # Only run deploy if ALL tests passed
    needs:
      - backend
      - relayer
      - hedger
      - streamer
      - contracts-polygon
      - contracts-zen
      - frontend
      - prover

    # Only deploy on main branch
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Reveal Market production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.69.29.255
          username: reveal
          port: 2222
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            echo ">>> Pull latest code"
            cd ~/apps/reveal-market
            export MAIN_REPO_SSH_KEY_PATH="${{ vars.MAIN_REPO_SSH_KEY_PATH }}"
            export PROVER_ARTIFACTS_SSH_KEY_PATH="${{ vars.PROVER_ARTIFACTS_SSH_KEY_PATH }}"
            # Expand leading ~ in key path if provided (quoted pattern prevents tilde expansion).
            if [ -n "${MAIN_REPO_SSH_KEY_PATH:-}" ]; then
              case "${MAIN_REPO_SSH_KEY_PATH}" in
                "~/"*) MAIN_REPO_SSH_KEY_PATH="${HOME}/${MAIN_REPO_SSH_KEY_PATH#"~/"}" ;;
              esac
            fi
            if [ -n "${PROVER_ARTIFACTS_SSH_KEY_PATH:-}" ]; then
              case "${PROVER_ARTIFACTS_SSH_KEY_PATH}" in
                "~/"*) PROVER_ARTIFACTS_SSH_KEY_PATH="${HOME}/${PROVER_ARTIFACTS_SSH_KEY_PATH#"~/"}" ;;
              esac
            fi
            MAIN_GIT_SSH_COMMAND=""
            if [ -n "${MAIN_REPO_SSH_KEY_PATH:-}" ] && [ -f "${MAIN_REPO_SSH_KEY_PATH}" ]; then
              MAIN_GIT_SSH_COMMAND="ssh -i ${MAIN_REPO_SSH_KEY_PATH} -o IdentitiesOnly=yes"
            elif [ -f "${HOME}/.ssh/reveal-market-gh-deploy" ]; then
              MAIN_GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/reveal-market-gh-deploy -o IdentitiesOnly=yes"
            fi
            SUBMODULE_GIT_SSH_COMMAND=""
            if [ -f "${PROVER_ARTIFACTS_SSH_KEY_PATH}" ]; then
              SUBMODULE_GIT_SSH_COMMAND="ssh -i ${PROVER_ARTIFACTS_SSH_KEY_PATH} -o IdentitiesOnly=yes"
            else
              echo "Artifacts SSH key missing at ${PROVER_ARTIFACTS_SSH_KEY_PATH}; submodule fetch may fail." >&2
            fi
            git status --short
            if ! git diff --quiet; then
              echo "Working tree dirty. Stash or commit changes before deploying." >&2
              exit 1
            fi
            if [ -n "${MAIN_GIT_SSH_COMMAND:-}" ]; then
              GIT_SSH_COMMAND="${MAIN_GIT_SSH_COMMAND}" git pull --rebase
            else
              git pull --rebase
            fi

            mkdir -p ~/.ssh
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
            if [ -n "${SUBMODULE_GIT_SSH_COMMAND:-}" ]; then
              GIT_SSH_COMMAND="${SUBMODULE_GIT_SSH_COMMAND}" git submodule update --init --recursive
            else
              git submodule update --init --recursive
            fi

            echo ">>> Run production deployment script"
            chmod +x run_prod.sh
            ./run_prod.sh

            echo ">>> Deployment complete"
