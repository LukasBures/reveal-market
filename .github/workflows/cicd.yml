name: Tests + Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/api/uv.lock', 'backend/worker/uv.lock', 'hedger/uv.lock', 'streamer/uv.lock') }}
      - name: Sync backend dependencies
        run: |
          uv sync --project backend/api --extra dev --no-install-project --frozen
          uv sync --project backend/worker --extra dev --no-install-project --frozen
          uv sync --project hedger --extra dev --no-install-project --frozen
          uv sync --project streamer --extra dev --no-install-project --frozen
      - name: Pre-commit checks
        run: uv run pre-commit run --all-files

  backend:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/api/uv.lock', 'backend/worker/uv.lock', 'hedger/uv.lock', 'streamer/uv.lock') }}

      - name: Sync backend dependencies
        run: |
          uv sync --project backend/api --extra dev --no-install-project --frozen
          uv sync --project backend/worker --extra dev --no-install-project --frozen
          uv sync --project hedger --extra dev --no-install-project --frozen
          uv sync --project streamer --extra dev --no-install-project --frozen

      - name: Run backend tests
        env:
          PYTEST_WORKER_COUNT: 4
        run: ./backend/run_tests.sh

      - name: Run shared backend tests
        env:
          PYTHONPATH: backend
          PYTEST_WORKER_COUNT: 4
        run: uv run --project backend/api -- python -m pytest -n "${PYTEST_WORKER_COUNT}" backend/shared/tests

      - name: Type check (mypy)
        run: uv run --project backend/api -- mypy --config-file backend/api/pyproject.toml backend/api/app backend/shared

      - name: OpenAPI snapshot check
        run: uv run --project backend/api -- pytest backend/api/tests/test_openapi_snapshot.py


  hedger:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('hedger/uv.lock') }}

      - name: Sync hedger dependencies
        run: |
          uv sync --project hedger --extra dev --no-install-project --frozen

      - name: Lint hedger
        run: uv run --project hedger -- ruff check app tests

      - name: Hedger tests
        env:
          PYTEST_WORKER_COUNT: 4
        run: ./hedger/run_tests.sh


  streamer:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('streamer/uv.lock') }}

      - name: Sync streamer dependencies
        run: |
          uv sync --project streamer --extra dev --no-install-project --frozen

      - name: Run streamer tests
        env:
          PYTEST_WORKER_COUNT: 4
        run: ./streamer/run_tests.sh

  contracts-polygon:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Polygon contracts pipeline
        working-directory: contracts/polygon
        run: ./run_tests.sh

  contracts-zen:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Generate contract error selectors
        run: python scripts/generate_error_selectors.py > contracts/cache/errors.json

      - name: Zen contracts pipeline
        working-directory: contracts/zen
        run: ./run_tests.sh


  frontend:
    needs: precommit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      RM_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || 'test-wc-project-id' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        env:
          NODE_ENV: production
        run: npm run build


  prover:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        if: ${{ hashFiles('prover/go.sum') != '' }}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('prover/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rapidsnark binary
        env:
          RAPIDSNARK_VERSION: v0.0.7
        run: |
          curl -fsSL -o /tmp/rapidsnark.zip "https://github.com/iden3/rapidsnark/releases/download/${RAPIDSNARK_VERSION}/rapidsnark-linux-x86_64-${RAPIDSNARK_VERSION}.zip"
          unzip -q /tmp/rapidsnark.zip -d /tmp/rapidsnark
          RS_DIR="/tmp/rapidsnark/rapidsnark-linux-x86_64-${RAPIDSNARK_VERSION}"
          echo "${RS_DIR}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${RS_DIR}/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Verify prover artifacts
        working-directory: prover
        run: go run ./cmd/verify-artifacts

      - name: Run prover tests
        working-directory: prover
        run: ./run_tests.sh -v

      - name: Go format check (prover)
        working-directory: prover
        run: |
          CHANGED=$(gofmt -l .)
          if [ -n "$CHANGED" ]; then
            echo "gofmt would reformat:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Go vet
        working-directory: prover
        run: go vet -v ./...


  deploy:
    # Only run deploy if ALL tests passed
    needs:
      - backend
      - hedger
      - streamer
      - contracts-polygon
      - contracts-zen
      - frontend
      - prover

    # Only deploy on main branch
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Reveal Market production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.69.29.255
          username: reveal
          port: 2222
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            echo ">>> Pull latest code"
            cd ~/apps/reveal-market
            git status --short
            if ! git diff --quiet; then
              echo "Working tree dirty. Stash or commit changes before deploying." >&2
              exit 1
            fi
            git pull --rebase

            echo ">>> Run production deployment script"
            chmod +x run_prod.sh
            ./run_prod.sh

            echo ">>> Deployment complete"
