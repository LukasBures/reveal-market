services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    # Bind Redis to localhost for local development/inspection only.
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  frontend:
    build:
      args:
        NEXT_DISABLE_MINIFY: ${NEXT_DISABLE_MINIFY:-false}
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  streamer:
    ports:
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  prover:
    ports:
      - "127.0.0.1:8085:8085"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  api:
    # Override prod-like defaults so local runs get verbose logs + live code reloading.
    environment:
      RM_ENVIRONMENT: local
      LOG_LEVEL: INFO
    # Bind-mount source directories so edits on the host immediately reflect in the container.
    volumes:
      - ./backend/api/app:/app/app
      - ./backend/shared:/app/shared
      - ./backend/migrations:/app/migrations
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  worker:
    environment:
      RM_ENVIRONMENT: local
      LOG_LEVEL: INFO
      # Mirror production heartbeat cadence so diagnostics fire once per minute.
      RM_POLL_INTERVAL_SECONDS: 300
      # Keep migrations enabled so a fresh database gets the schema before the worker starts syncing.
      RM_RUN_MIGRATIONS_ON_STARTUP: "true"
    volumes:
      - ./backend/worker/app:/worker/app
      - ./backend/shared:/worker/shared
      # Mount migrations for parity with the API container (worker can run cleanup scripts).
      - ./backend/migrations:/worker/migrations
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  hedger:
    profiles: ["hedger"]
    environment:
      HEDGER_ENVIRONMENT: dev
      HEDGER_LOG_LEVEL: DEBUG
    volumes:
      - ./hedger/app:/hedger/app
      - ./backend/shared:/hedger/shared
    ports:
      - "127.0.0.1:8090:8090"
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  relayer:
    ports:
      - "127.0.0.1:${RELAYER_PORT:-8088}:${RELAYER_PORT:-8088}"
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 160M
