services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    # Bind Redis to localhost for local development/inspection only.
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  frontend:
    build:
      args:
        NEXT_DISABLE_MINIFY: ${NEXT_DISABLE_MINIFY:-false}
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  streamer:
    ports:
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  prover:
    ports:
      - "127.0.0.1:8085:8085"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  api:
    # Bind-mount source directories so edits on the host immediately reflect in the container.
    volumes:
      - ./backend/api/app:/app/app
      - ./backend/shared:/app/shared
      - ./backend/migrations:/app/migrations
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    volumes:
      - ./backend/worker/app:/worker/app
      - ./backend/shared:/worker/shared
      # Mount migrations for parity with the API container (worker can run cleanup scripts).
      - ./backend/migrations:/worker/migrations

  hedger:
    volumes:
      - ./hedger/app:/hedger/app
      - ./backend/shared:/hedger/shared
    ports:
      - "127.0.0.1:8090:8090"
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  relayer:
    ports:
      - "127.0.0.1:${RELAYER_PORT:-8088}:${RELAYER_PORT:-8088}"
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 160M

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "127.0.0.1:3001:3000"
