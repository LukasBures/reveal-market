services:
  api:
    environment:
      MODE: dev
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend/api/app:/app/app
      - ./backend/shared:/app/shared
      - ./backend/migrations:/app/migrations

  worker:
    environment:
      MODE: dev
      LOG_LEVEL: DEBUG
      RM_POLL_INTERVAL_SECONDS: 15
    volumes:
      - ./backend/worker/app:/worker/app
      - ./backend/shared:/worker/shared

  frontend:
    environment:
      DOCS_HOST: docs.local.revealmarket.xyz
