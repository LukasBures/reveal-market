services:
  redis:
    # Bind Redis to localhost for local development/inspection only.
    ports:
      - "127.0.0.1:6379:6379"

  frontend:
    build:
      args:
        NEXT_DISABLE_MINIFY: ${NEXT_DISABLE_MINIFY:-true}
    ports:
      - "127.0.0.1:3000:3000"

  streamer:
    ports:
      - "127.0.0.1:8100:8100"

  prover:
    ports:
      - "127.0.0.1:8085:8085"

  caddy:
    ports:
      - "127.0.0.1:2019:2019"

  api:
    # Override prod-like defaults so local runs get verbose logs + live code reloading.
    environment:
      MODE: dev
      LOG_LEVEL: INFO
    # Bind-mount source directories so edits on the host immediately reflect in the container.
    volumes:
      - ./backend/api/app:/app/app
      - ./backend/shared:/app/shared
      - ./backend/migrations:/app/migrations
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    environment:
      MODE: dev
      LOG_LEVEL: INFO
      # Mirror production heartbeat cadence so diagnostics fire once per minute.
      RM_POLL_INTERVAL_SECONDS: 60
      # Keep migrations enabled so a fresh database gets the schema before the worker starts syncing.
      RM_RUN_MIGRATIONS_ON_STARTUP: "true"
    volumes:
      - ./backend/worker/app:/worker/app
      - ./backend/shared:/worker/shared
      # Mount migrations for parity with the API container (worker can run cleanup scripts).
      - ./backend/migrations:/worker/migrations

  hedger:
    profiles: ["hedger"]
    environment:
      HEDGER_ENVIRONMENT: dev
      HEDGER_LOG_LEVEL: DEBUG
    volumes:
      - ./hedger/app:/hedger/app
      - ./backend/shared:/hedger/shared
    ports:
      - "127.0.0.1:8090:8090"
