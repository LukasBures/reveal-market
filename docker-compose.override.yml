services:
  api:
    environment:
      MODE: dev
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend/api/app:/app/app
      - ./backend/shared:/app/shared
      - ./backend/migrations:/app/migrations

  worker:
    environment:
      MODE: dev
      LOG_LEVEL: DEBUG
      RM_POLL_INTERVAL_SECONDS: 15
    volumes:
      - ./backend/worker/app:/worker/app
      - ./backend/shared:/worker/shared

  frontend:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      RM_API_BASE_URL: http://api:8000
      DOCS_HOST: docs.local.revealmarket.xyz
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
