# Gitleaks configuration — allowlist patterns for CI scanning.
# We scan the file tree (--no-git) so only current source is checked.

[allowlist]

# Environment example/template files use placeholder values
paths = [
  '''\.env\.example$''',
  '''contracts/zen/\.env\.example$''',
]

# Allowlist regexes: dummy keys in test fixtures, placeholder secrets, etc.
regexTarget = "line"
regexes = [
  # Repeated-nibble dummy private keys (0x1111..., 0x0101...)
  '''0x(([0-9a-fA-F])\2{63}|([0-9a-fA-F]{2})\3{31})''',
  # Test-only placeholder secrets and tokens
  '''(?i)(test[_-]?secret|changeme|placeholder|dummy|example|PRIVATE_KEY=0xYOUR)''',
  # Foundry/Anvil well-known default private keys
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  # Zero-filled keys used as defaults
  '''0x0{64}''',
]
