groups:
  - name: prover-alerts
    rules:
      - alert: ProverHighFailureRate
        expr: rate(prover_proofs_failure_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prover failures spiking"
          description: "Prover failures exceeded 0.1/sec over 5 minutes."

      - alert: ProverHighLatency
        expr: histogram_quantile(0.95, sum(rate(prover_request_latency_seconds_bucket[5m])) by (le)) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prover latency high"
          description: "95th percentile proof latency exceeded 60s."

      - alert: ProverUnavailable
        expr: prover_up < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prover down"
          description: "Prover /metrics scrape reports down."
