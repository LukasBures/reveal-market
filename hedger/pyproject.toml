[project]
name = "reveal-market-hedger"
version = "0.1.0"
description = "Off-chain hedger coordinating RevealMarket exposure, liquidity, and settlements."
readme = "README.md"
authors = [{ name = "Reveal Market", email = "dev@revealmarket.xyz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111,<0.112",
    "uvicorn>=0.29,<0.30",
    "httpx>=0.27,<0.28",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "prometheus-client>=0.20,<1.0",
    "tenacity>=9.0,<10.0",
    "python-json-logger>=2.0,<3.0",
    "web3>=6.20,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
