[project]
name = "reveal-market-hedger"
version = "0.5.0"
description = "Off-chain hedger coordinating RevealMarket exposure, liquidity, and settlements."
readme = "README.md"
authors = [{ name = "Reveal Market", email = "dev@revealmarket.xyz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.129,<0.130",
    "uvicorn>=0.29,<0.30",
    "httpx>=0.27,<0.28",
    "pydantic~=2.12.4",
    "pydantic-settings~=2.12.0",
    "redis~=5.3.1",
    "sqlalchemy~=2.0.44",
    "asyncpg~=0.31.0",
    "aiosqlite~=0.22.1",
    "greenlet~=3.3.2",
    "prometheus-client>=0.23.1,<0.27.0",
    "tenacity~=9.1.2",
    "python-json-logger~=2.0.7",
    "web3~=7.14.0",
    "py-clob-client>=0.28.0,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-xdist>=3.6,<4.0",
    "mypy>=1.10,<2.0",
    "ruff==0.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
