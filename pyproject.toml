[project]
name = "reveal-market"
version = "0.3.0"
description = "Reveal Market delivers private, commit-and-reveal prediction markets with live odds streaming, signed quotes, and end-to-end settlement built for institutional-grade trading."
authors = [
    {name = "Lukas Bures, Ph.D.",email = "me@lukasbures.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pre-commit>=4.5.0",
]

# ---------------------------------------------------------------------
# Tool Configurations
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "contracts/polygon/lib/**",
    "contracts/zen/lib/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP", "S"]
ignore = ["B008", "S101"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
case-sensitive = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "-q",
    "--color=yes",
    "--disable-warnings"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that depend on external systems",
    "unit: marks pure logic tests"
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["backend", "hedger", "streamer"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "py_clob_client.*",
    "web3.providers.async_rpc",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.local_logging", "app.logging_config"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["streamer.*"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["streamer.app.*"]
ignore_errors = true
follow_imports = "skip"

[build-system]
requires = ["hatchling>=1.8.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["backend"]
