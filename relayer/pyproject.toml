[project]
name = "reveal-relayer"
version = "0.1.0"
description = "Trusted relayer for Reveal Market commit/claim flows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "web3==6.19.0",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "structlog==24.2.0",
    "prometheus-client==0.20.0",
    "psycopg[binary]==3.2.3"
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "httpx==0.27.0",
    "pytest-asyncio==0.23.7",
    "mypy==1.11.1"
]
